<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <title>RKR Airdrop Center</title>

    <style>
        body {

            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 420px;
            margin: auto;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .menu-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .action-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .action-btn-green {
            background-color: #10b981;
        }
        .action-btn-orange {
            background-color: #f59e0b;
        }
        h2 { color: #f0a500; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 RKR Airdrop Center</h2>

        <!-- ১. ব্যালেন্স এবং কয়েন রেট ($0.10) -->
        <div class="card">
            <p style="margin: 0; font-size: 13px; color: #94a3b8;">Your Balance</p>
            <h1 id="user-balance" style="margin: 5px 0; color: #38bdf8;">0 $RKR</h1>
            <p style="margin: 0; font-size: 14px; color: #10b981;">≈ $<span id="usd-value">0.00</span> USD (1 $RKR = $0.10)</p>
        </div>

        <!-- ২. লেভেল, স্কিন কাউন্টার এবং স্পিন ব্যালেন্স -->
        <div class="card">
            <h3 style="margin: 5px 0;">Level: <span id="user-level" style="color: #f0a500;">1</span></h3>
            <p style="margin: 5px 0; font-size: 16px;">Skin Counter: <b id="skin-counter">0</b>/100</p>
            <p style="margin: 5px 0; font-size: 15px; color: #cbd5e1;">অবশিষ্ট স্পিন: <b id="spin-balance" style="color: #38bdf8;">10</b> টি</p>
        </div>

        <div class="card">
            <h4 style="margin: 5px 0 10px 0;">🌀 Spin System</h4>
            <button class="action-btn" onclick="makeSpin(1)">Spin 1x</button>
            <button class="action-btn action-btn-green" onclick="makeSpin(10)">Batch Spin 10x</button>

            <button class="action-btn action-btn-orange" onclick="watchAdForSpins()">🎬 Watch Ad (+5 Spins)</button>
        </div>

        <!-- ৪. মেনু বাটনসমূহ -->
        <div class="btn-grid">

            <button class="menu-btn" onclick="alert('Official Support')">🎧 Support</button>
        </div>
    </div>
