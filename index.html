<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKR Airdrop Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 420px; margin: auto; }
        .card { background: #1e293b; padding: 15px; border-radius: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .menu-btn { background-color: #334155; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .action-btn { background-color: #0ea5e9; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; }
        .action-btn-green { background-color: #10b981; }
        .action-btn-orange { background-color: #f59e0b; }
        h2 { color: #f0a500; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 RKR Airdrop Center</h2>

        <!-- ব্যালেন্স এবং কয়েন রেট -->
        <div class="card">
            <p style="margin: 0; font-size: 13px; color: #94a3b8;">Your Balance</p>
            <h1 id="user-balance" style="margin: 5px 0; color: #38bdf8;">0 $RKR</h1>
            <p style="margin: 0; font-size: 14px; color: #10b981;">≈ $<span id="usd-value">0.00</span> USD (1 $RKR = $0.10)</p>
        </div>

        <!-- লেভেল, স্কিন কাউন্টার ও স্পিন -->
        <div class="card">
            <h3 style="margin: 5px 0;">Level: <span id="user-level" style="color: #f0a500;">1</span></h3>
            <p style="margin: 5px 0; font-size: 16px;">Skin Counter: <b id="skin-counter">0</b>/100</p>
            <p style="margin: 5px 0; font-size: 15px; color: #cbd5e1;">অবশিষ্ট স্পিন: <b id="spin-balance" style="color: #38bdf8;">10</b> টি</p>
        </div>

        <!-- স্পিন ও অ্যাড রিফিল -->
        <div class="card">
            <h4 style="margin: 5px 0 10px 0;">🌀 Spin System</h4>
            <button class="action-btn" onclick="makeSpin(1)">Spin 1x</button>
            <button class="action-btn action-btn-green" onclick="makeSpin(10)">Batch Spin 10x</button>
            <button class="action-btn action-btn-orange" onclick="watchAdForSpins()">🎬 Watch Ad (+5 Spins)</button>
        </div>

        <!-- মেনু বাটন -->
        <div class="btn-grid">
            <button class="menu-btn" onclick="alert('Spin Game')">🎡 Spin Game</button>
            <button class="menu-btn" onclick="alert('Tasks')">🎯 Tasks</button>
            <button class="menu-btn" onclick="openReferral()">👥 Referral</button>
            <button class="menu-btn" onclick="openPremium()">⭐ Premium</button>
            <button class="menu-btn" onclick="alert('Leaderboard')">🏆 Leaderboard</button>
            <button class="menu-btn" onclick="alert('TON Wallet')">👛 Wallet</button>
            <button class="menu-btn" onclick="alert('Roadmap')">🗺️ Roadmap</button>
            <button class="menu-btn" onclick="alert('Support')">🎧 Support</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentLevel = 1;
        let skinCounter = 0;
        let userBalance = 0;
        let spinBalance = 10; 
        const coinRateUSD = 0.10;
        
        // আপনার চ্যাট/চ্যানেল লিঙ্ক
        const officialChannelUrl = "https://t.me/YOUR_CHANNEL_USERNAME"; 

        function updateUI() {
            document.getElementById("user-level").innerText = currentLevel;
            document.getElementById("skin-counter").innerText = skinCounter;
            document.getElementById("user-balance").innerText = userBalance + " $RKR";
            document.getElementById("spin-balance").innerText = spinBalance;
            let totalUSD = (userBalance * coinRateUSD).toFixed(2);
            document.getElementById("usd-value").innerText = totalUSD;
        }

        function makeSpin(spinAmount) {
            if (spinBalance < spinAmount) {
                alert("❌ আপনার স্পিন শেষ! অ্যাড দেখে ৫টি স্পিন নিন।");
                return;
            }
            spinBalance -= spinAmount;
            let remainingSpins = spinAmount;

            while (remainingSpins > 0) {
                let isGoingUp = (currentLevel % 2 !== 0);
                if (isGoingUp) {
                    let neededTo100 = 100 - skinCounter;
                    if (remainingSpins >= neededTo100) {
                        remainingSpins -= neededTo100;
                        skinCounter = 100;
                        userBalance += 1;
                        currentLevel++;
                        skinCounter = 100;
                    } else {
                        skinCounter += remainingSpins;
                        remainingSpins = 0;
                    }
                } else {
                    let neededTo0 = skinCounter;
                    if (remainingSpins >= neededTo0) {
                        remainingSpins -= neededTo0;
                        skinCounter = 0;
                        userBalance += 1;
                        currentLevel++;
                        skinCounter = 0;
                    } else {
                        skinCounter -= remainingSpins;
                        remainingSpins = 0;
                    }
                }
            }
            updateUI();
        }

        function watchAdForSpins() {
            alert("▶️ অ্যাড দেখা হচ্ছে...");
            spinBalance += 5;
            updateUI();
            alert("🎉 ৫টি ফ্রি স্পিন যোগ হয়েছে!");
        }

        function openReferral() {
            window.open(officialChannelUrl, '_blank');
            alert("⚠️ অফিশিয়াল চ্যানেলে জয়েন চেক করা হচ্ছে। জয়েন শেষ হলে বট ব্যাকএন্ড আপনার ৩ $RKR + ১০ স্পিন যোগ করবে!");
        }

        function openPremium() {
            alert("⭐ Premium Store Offer:\n১. ৫০ Stars = ১,০০০ স্পিন + ৫০ $RKR\n২. ১০০ Stars = ২,৫০০ স্পিন + ১২০ $RKR");
        }

        updateUI();
    </script>

</body>
</html>
