<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RKR Coin Airdrop Center</title>
    <!-- Phaser 3 Game Engine & Telegram WebApp SDK -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* টপ হেডার বার */
        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.85);
            padding: 8px 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 35px;
            height: 35px;
            background: #f59e0b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }
        .balances {
            display: flex;
            gap: 15px;
        }
        .coin-box {
            text-align: right;
        }
        .coin-box span {
            font-size: 11px;
            color: #94a3b8;
            display: block;
        }
        .coin-box strong {
            font-size: 14px;
            color: #38bdf8;
        }

        /* বটম ন্যাভিগেশন বার */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0f172a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-item span {
            font-size: 18px;
        }

        /* পপআপ ম্যালফংশন/মডাল */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            width: 85%;
            max-width: 350px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }
        .modal-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .close-btn {
            background: #ef4444;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- শীর্ষ ক্যাশ ও ব্যালেন্স বার -->
        <div class="top-bar">
            <div class="user-info">
                <div class="user-avatar" id="avatar-text">R</div>
                <div style="font-size: 13px; font-weight: bold;" id="username-display">RKR User</div>
            </div>
            <div class="balances">
                <div class="coin-box">
                    <span>Balance</span>
                    <strong id="header-balance">0 $RKR</strong>
                </div>
                <div class="coin-box">
                    <span>USD Value</span>
                    <strong id="header-usd" style="color: #10b981;">$0.00</strong>
                </div>
            </div>
        </div>

        <!-- ফুটার মেনু ট্যাব -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('wheel')"><span>🎡</span>Wheel</button>
            <button class="nav-item" onclick="openModal('tasks-modal')"><span>🎯</span>Tasks</button>
            <button class="nav-item" onclick="openModal('ref-modal')"><span>👥</span>Referral</button>
            <button class="nav-item" onclick="openModal('premium-modal')"><span>⭐</span>Premium</button>
        </div>
    </div>

    <!-- টাস্ক মডাল -->
    <div id="tasks-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #f0a500; margin-top:0;">🎯 Daily & Social Tasks</h3>
            <p style="font-size: 13px; color: #cbd5e1;">চ্যানেলে জয়েন করুন এবং টাস্ক সম্পন্ন করে ফ্রি স্পিন ও কয়েন নিন!</p>
            <button class="modal-btn" onclick="alert('চ্যানেল জয়েন সফল!')">📢 Join Official Channel (+5 $RKR)</button>
            <button class="modal-btn" onclick="alert('ডেইলি চেক-ইন সফল!')">🎁 Daily Check-in (+2 $RKR)</button>
            <button class="modal-btn close-btn" onclick="closeModal('tasks-modal')">Close</button>
        </div>
    </div>

    <!-- রেফারেল মডাল -->
    <div id="ref-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #38bdf8; margin-top:0;">👥 Referral System</h3>
            <p style="font-size: 13px; color: #cbd5e1;">প্রতি রেফারে পাবেন ৩ $RKR + ১০ স্পিন এবং ৫% লাইফটাইম কমিশন!</p>
            <button class="modal-btn" onclick="alert('রেফারেল লিংক কপি হয়েছে!')">🔗 Copy Referral Link</button>
            <button class="modal-btn close-btn" onclick="closeModal('ref-modal')">Close</button>
        </div>
    </div>

    <!-- প্রিমিয়াম স্টোর মডাল -->
    <div id="premium-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #f0a500; margin-top:0;">⭐ Premium Store</h3>
            <p style="font-size: 13px; color: #cbd5e1;">প্যাকেজ ১: ৫০ Telegram Stars = ১,০০০ স্পিন + ৫০ $RKR</p>
            <button class="modal-btn" onclick="alert('Telegram Stars পেমেন্ট গেটওয়ে ওপেন হচ্ছে...')">⭐ Buy with Stars</button>
            <button class="modal-btn close-btn" onclick="closeModal('premium-modal')">Close</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ইউজারের নাম সেট করা
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let uName = tg.initDataUnsafe.user.first_name || "User";
            document.getElementById("username-display").innerText = uName;
            document.getElementById("avatar-text").innerText = uName.charAt(0).toUpperCase();
        }

        let userBalance = 0;
        let skinCounter = 0;
        let currentLevel = 1;
        let spinBalance = 15;
        const coinRateUSD = 0.10; // ১ $RKR = $0.10 USD

        function updateTopBar() {
            document.getElementById("header-balance").innerText = userBalance + " $RKR";
            let usd = (userBalance * coinRateUSD).toFixed(2);
            document.getElementById("header-usd").innerText = "$" + usd;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function switchTab(tab) { alert("Switched to " + tab); }

        // PhaserJS গেম ইঞ্জিন দিয়ে প্রফেশনাল স্পিন হুইল ও ইন্টারফেস তৈরি
        class MainScene extends Phaser.Scene {
            constructor() {
                super('MainScene');
            }

            preload() {
                // দরকারি গ্রাফিক্স বা অ্যাসেট লোড
            }

            create() {
                let width = this.scale.width;
                let height = this.scale.height;

                // ব্যাকগ্রাউন্ড গ্লো ইফেক্ট
                this.add.circle(width / 2, height / 2 - 50, 140, 0x1e293b, 0.8).setStrokeStyle(3, 0xf0a500);

                // স্পিন হুইল (চাকা) আঁকা
                this.wheel = this.add.container(width / 2, height / 2 - 50);
                
                let colors = [0x38bdf8, 0x10b981, 0xf59e0b, 0xef4444, 0x8b5cf6, 0xec4899];
                for (let i = 0; i < 6; i++) {
                    let graphics = this.add.graphics();
                    graphics.fillStyle(colors[i], 1);
                    graphics.slice(0, 0, 120, Phaser.Math.DegToRad(i * 60), Phaser.Math.DegToRad((i + 1) * 60), true);
                    graphics.fillPath();
                    this.wheel.add(graphics);
                }

                // চাকার ওপর সেন্ট্রাল লোগো বক্স
                let centerBox = this.add.circle(0, 0, 35, 0x0f172a);
                centerBox.setStrokeStyle(3, 0xf0a500);
                let centerText = this.add.text(0, 0, "RKR", { fontSize: '16px', fill: '#f0a500', fontStyle: 'bold' }).setOrigin(0.5);
                this.wheel.add([centerBox, centerText]);

                // পয়েন্টার বা সূচিপত্র
                let pointer = this.add.triangle(width / 2, height / 2 - 180, 0, 0, 20, 0, 10, 20, 0xffffff);
                pointer.setDepth(10);

                // লেভেল ও কাউন্টার টেক্সট
                this.levelText = this.add.text(width / 2, height / 2 + 105, `Level: ${currentLevel} (Skin: ${skinCounter}/100)`, {
                    fontSize: '15px', fill: '#f0a500', fontStyle: 'bold'
                }).setOrigin(0.5);

                this.spinInfoText = this.add.text(width / 2, height / 2 + 130, `অবশিষ্ট স্পিন: ${spinBalance} টি`, {
                    fontSize: '14px', fill: '#38bdf8'
                }).setOrigin(0.5);

                // স্পিন বাটন (Spin Button)
                let spinBtnBg = this.add.rectangle(width / 2, height / 2 + 190, 240, 50, 0x0ea5e9).setInteractive();
                spinBtnBg.setStrokeStyle(2, 0xffffff);
                let spinBtnText = this.add.text(width / 2, height / 2 + 190, "SPIN NOW", {
                    fontSize: '18px', fill: '#ffffff', fontStyle: 'bold'
                }).setOrigin(0.5);

                spinBtnBg.on('pointerdown', () => {
                    this.triggerSpin();
                });

                // অ্যাড দেখে স্পিন নেওয়ার বাটন
                let adBtnBg = this.add.rectangle(width / 2, height / 2 + 250, 240, 45, 0xf59e0b).setInteractive();
                let adBtnText = this.add.text(width / 2, height / 2 + 250, "🎬 Watch Ad (+5 Spins)", {
                    fontSize: '15px', fill: '#ffffff', fontStyle: 'bold'
                }).setOrigin(0.5);

                adBtnBg.on('pointerdown', () => {
                    spinBalance += 5;
                    this.spinInfoText.setText(`অবশিষ্ট স্পিন: ${spinBalance} টি`);
                    alert("🎉 সফলভাবে ৫টি ফ্রি স্পিন যোগ হয়েছে!");
                });
            }

            triggerSpin() {
                if (spinBalance <= 0) {
                    alert("❌ আপনার স্পিন শেষ! 'Watch Ad' বাটনে ক্লিক করে স্পিন নিন।");
                    return;
                }

                spinBalance--;
                this.spinInfoText.setText(`অবশিষ্ট স্পিন: ${spinBalance} টি`);

                // চাকা ঘোরার অ্যানিমেশন
                let randomAngle = 1440 + Phaser.Math.Between(0, 360);
                this.tweens.add({
                    targets: this.wheel,
                    angle: this.wheel.angle + randomAngle,
                    duration: 2000,
                    ease: 'Cubic.easeOut',
                    onComplete: () => {
                        // স্কিন সাইকেল লজিক হিসাব
                        let isGoingUp = (currentLevel % 2 !== 0);
                        if (isGoingUp) {
                            skinCounter += 20;
                            if (skinCounter >= 100) {
                                skinCounter = 100;
                                userBalance += 1; // ১ $RKR কয়েন যোগ
                                currentLevel++;
                                skinCounter = 0;
                            }
                        } else {
                            skinCounter -= 20;
                            if (skinCounter <= 0) {
                                skinCounter = 0;
                                userBalance += 1; // ১ $RKR কয়েন যোগ
                                currentLevel++;
                                skinCounter = 100;
                            }
                        }

                        this.levelText.setText(`Level: ${currentLevel} (Skin: ${skinCounter}/100)`);
                        updateTopBar();
                    }
                });
            }
        }

        // Phaser গেম কনফিগারেশন
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth > 450 ? 450 : window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            scene: [MainScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
